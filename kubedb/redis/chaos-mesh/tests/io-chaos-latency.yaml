apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-latency-example
  namespace: chaos-mesh
spec:
  action: latency
  mode: all
  selector:
    namespaces:
      - chaostesting
    labelSelectors:
      app.kubernetes.io/name: redises.kubedb.com
      kubedb.com/role: master
  volumePath: /data
  path: '/data/**/*'
  delay: '100ms'
  percent: 50
  duration: '400s'