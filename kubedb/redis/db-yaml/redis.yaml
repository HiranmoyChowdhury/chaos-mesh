apiVersion: kubedb.com/v1
kind: Redis
metadata:
  name: vk-sen
  namespace: chaostesting
spec:
  version: 8.2.2
  replicas: 3
  sentinelRef:
    name: sen
    namespace: demo
  mode: Sentinel
  storage:
    resources:
      requests:
        storage: 1Gi
    storageClassName: "standard"
    accessModes:
      - ReadWriteOnce
  deletionPolicy: WipeOut